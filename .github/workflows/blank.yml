name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Usar o src zip mais novo
        run: |
          newest=""; best=0
          for f in src*.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -gt "$best" ]; then best=$t; newest="$f"; fi
          done
          if [ -n "$newest" ]; then echo "Usando $newest"; rm -rf src; unzip -o "$newest"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.1.1 }
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: greatsage-jar
          path: build/libs/*.jar
